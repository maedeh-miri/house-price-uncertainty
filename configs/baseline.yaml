project:
  name: house-price-uncertainty

data:
  dataset_path: data/raw/AmesHousing.txt
  target_column: SalePrice

split:
  primary_protocol: random
  first_random_state: 42
  second_random_state: 43
  temporal:
    train_end_year: 2008
    calibration_year: 2009
    test_year: 2010

model:
  name: ridge
  log_transform_target: false
  parameters:
    alpha: 1.0

evaluation:
  cross_validation_folds: 5
  interval_confidence: 0.90
  subgroup_columns:
    - Neighborhood
